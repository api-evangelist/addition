aid: addition
name: Addition
description: >-
  Addition is a New York City-based venture capital firm founded in 2020 by Lee
  Fixel, the former head of Tiger Global Management's private equity business.
  The firm invests in founder-led, technology-enabled companies across multiple
  stages, allocating roughly one-third of its capital to early-stage
  investments and the remainder to growth-stage opportunities. Sectors of focus
  include software and SaaS, fintech and payments, artificial intelligence and
  machine learning, developer tools and infrastructure, cybersecurity,
  consumer, logistics, and clean energy. Typical checks range from about $10M to
  $200M, with a reported sweet spot near $30M-$50M. Addition operates a
  streamlined solo-GP model with Fixel as sole managing partner making final
  investment decisions, enabling fast conviction. Across Addition One through
  Addition Five (2020-2023) the firm raised roughly $7B-$7.3B in committed
  capital. Notable investments include Stripe, Snyk, Hugging Face, Chainalysis,
  Navan, dLocal, Delhivery, Airwallex, Freshworks, Warby Parker, and Lyra
  Health.
